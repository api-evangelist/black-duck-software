name: Black Duck Software
description: 'Black Duck Software is an independent application security company (formerly the Synopsys
  Software Integrity Group, spun out in October 2024 and backed by Clearlake Capital and Francisco Partners).
  Its portfolio spans Software Composition Analysis (Black Duck SCA), static analysis (Coverity), dynamic
  and interactive testing, fuzzing, and the Polaris SaaS platform, helping organizations find and fix
  open-source, license, and security risk across the SDLC. Black Duck exposes a versioned REST API (custom
  media types, bearer-token / API-token auth, HAL-style hypermedia), native CI/CD plug-ins, the Detect
  command-line scanner, webhooks, and an official MCP server (Black Duck Signal) for AI coding assistants.'
